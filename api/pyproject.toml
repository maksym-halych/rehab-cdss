[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "rehab-cdss-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio==5.34.2",
    "langchain-openai>=0.2.0",
    "pydantic>=2.0",
    "matplotlib==3.8.4",
    "numpy==1.26.4",
    "pdfplumber==0.11.4",
    "pillow==10.4.0",
    "pymupdf==1.24.10",
    "pypdf==4.3.1",
    "python-docx==1.1.2",
    "requests>=2.32.5",
    "chromadb>=0.6.0",
    "langgraph>=1.1.1",
    "rapidfuzz>=3.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "aiofiles>=24.1.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
rehab-start = "ui.app:launch_app"
rehab-api = "api.app:launch_api"
rehab-all = "api.app:launch_all"

# One copy of the repo per environment: ~/rehab-cdss (prod) and ~/rehab-cdss-dev (dev).
# The folder name is the Compose project name, so the two stacks do not collide.
# Set HOST_PORT in each copy's api/.env. Run Compose with --env-file api/.env,
# so that HOST_PORT is also used for the port mapping below.
services:
  api:
    build: ./api
    env_file: api/.env
    ports:
      # Localhost only: the host's Caddy proxies public traffic to this port
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    volumes:
      - ./data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# A new push to the same PR cancels the old run
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-lint:
    name: API lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      # Only the dev group (ruff, pre-commit): the lint does not need the backend dependencies
      - name: Ruff
        run: uv run --project api --locked --only-group dev ruff check --output-format=github api/src api/tests scripts

  api-tests:
    name: API tests (offline providers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    # Empty Postgres 16 (the Supabase version) for the migration and constraint tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rehab
          POSTGRES_PASSWORD: rehab
          POSTGRES_DB: rehab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rehab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://rehab:rehab@127.0.0.1:5432/rehab_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
          python-version: '3.12'

      - name: Unit tests and synthetic pipeline
        run: uv run --locked pytest --cov --cov-fail-under=60 --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov

      - name: Save coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            api/coverage.xml
            api/htmlcov/
          if-no-files-found: warn

  api-docker:
    name: API Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build --progress=plain --tag rehab-cdss:ci ./api

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      # tsc -b type-checks the project before vite build
      - name: Type check and build
        run: npm run build

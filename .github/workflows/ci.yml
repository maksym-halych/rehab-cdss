name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# A new push to the same PR cancels the old run
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-lint:
    name: API lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      # Only the dev group (ruff, pre-commit): the lint does not need the backend dependencies
      - name: Ruff
        run: uv run --project api --locked --only-group dev ruff check --output-format=github api/src scripts

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      # tsc -b type-checks the project before vite build
      - name: Type check and build
        run: npm run build
